name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Project and Build APK
        run: |
          flutter create --org com.iab --project-name phone iab_phone
          cd iab_phone
          flutter pub add firebase_core cloud_firestore url_launcher
          cp ../main.dart lib/main.dart
          cp ../google-services.json android/app/google-services.json

          # 1. Force minSdk to 23 across all gradle configurations
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' {} +
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' {} +
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' {} +
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdk = 21/minSdk = 23/g' {} +
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdkVersion 21/minSdkVersion 23/g' {} +

          # 2. Add Google Services Gradle Plugin
          python3 -c '
          import os

          for sf in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(sf):
                  with open(sf, "r") as f:
                      c = f.read()
                  if "com.google.gms.google-services" not in c:
                      if sf.endswith(".kts"):
                          c = c.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false")
                      else:
                          c = c.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false")
                  with open(sf, "w") as f:
                      f.write(c)

          for bf in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(bf):
                  with open(bf, "r") as f:
                      c = f.read()
                  if "com.google.gms.google-services" not in c:
                      if bf.endswith(".kts"):
                          c = c.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\")")
                      else:
                          c += "\napply plugin: \"com.google.gms.google-services\"\n"
                  with open(bf, "w") as f:
                      f.write(c)

          mf = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf):
              with open(mf, "r") as f:
                  c = f.read()
              queries = """
                  <queries>
                      <intent>
                          <action android:name="android.intent.action.VIEW" />
                          <data android:scheme="tel" />
                      </intent>
                      <intent>
                          <action android:name="android.intent.action.VIEW" />
                          <data android:scheme="sms" />
                      </intent>
                      <package android:name="com.whatsapp" />
                  </queries>
              """
              if "<queries>" not in c:
                  c = c.replace("</manifest>", queries + "\n</manifest>")
              with open(mf, "w") as f:
                  f.write(c)
          '

          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: IAB-Phone-App
          path: iab_phone/build/app/outputs/flutter-apk/app-release.apk
