name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Project and Build APK
        run: |
          flutter create --org com.iab --project-name phone iab_phone
          cd iab_phone
          flutter pub add firebase_core cloud_firestore url_launcher
          cp ../main.dart lib/main.dart
          cp ../google-services.json android/app/google-services.json
          
          python3 -c '
          import os

          # 1. Update app build.gradle / build.gradle.kts to minSdk 23
          gradle_file = "android/app/build.gradle.kts" if os.path.exists("android/app/build.gradle.kts") else "android/app/build.gradle"
          with open(gradle_file, "r") as f:
              content = f.read()

          content = content.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
          content = content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")

          if "com.google.gms.google-services" not in content:
              if gradle_file.endswith(".kts"):
                  content = content.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\")")
              else:
                  content += "\napply plugin: \"com.google.gms.google-services\"\n"

          with open(gradle_file, "w") as f:
              f.write(content)

          # 2. Update settings.gradle / settings.gradle.kts
          settings_file = "android/settings.gradle.kts" if os.path.exists("android/settings.gradle.kts") else "android/settings.gradle"
          with open(settings_file, "r") as f:
              s_content = f.read()

          if "com.google.gms.google-services" not in s_content:
              if settings_file.endswith(".kts"):
                  s_content = s_content.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false")
              else:
                  s_content = s_content.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false")

          with open(settings_file, "w") as f:
              f.write(s_content)

          # 3. Update AndroidManifest.xml
          manifest_file = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_file, "r") as f:
              m_content = f.read()

          queries = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="tel" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="sms" />
                  </intent>
                  <package android:name="com.whatsapp" />
              </queries>
          """
          if "<queries>" not in m_content:
              m_content = m_content.replace("</manifest>", queries + "\n</manifest>")

          with open(manifest_file, "w") as f:
              f.write(m_content)
          '
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: IAB-Phone-App
          path: iab_phone/build/app/outputs/flutter-apk/app-release.apk
