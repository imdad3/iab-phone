name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Project and Build APK
        run: |
          flutter create --org com.iab --project-name phone iab_phone
          cd iab_phone
          flutter pub add firebase_core cloud_firestore url_launcher shared_preferences
          cp ../main.dart lib/main.dart
          cp ../google-services.json android/app/google-services.json

          # ১. অ্যাপ আইকন তৈরির জন্য ভেক্টর কনভার্টার ইনস্টল করা
          sudo apt-get update -y && sudo apt-get install -y librsvg2-bin

          # ২. আইএবি ফোন ডিরেক্টরির নিজস্ব অফিসিয়াল লোগো ফাইল তৈরি করা
          cat << 'EOF' > iab_logo.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#005A4D"/>
                <stop offset="100%" stop-color="#002922"/>
              </linearGradient>
              <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE082"/>
                <stop offset="50%" stop-color="#FFCA28"/>
                <stop offset="100%" stop-color="#FFA000"/>
              </linearGradient>
            </defs>

            <!-- ব্যাকগ্রাউন্ড স্কোয়ারক্যাল ও গোল্ডেন বর্ডার -->
            <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
            <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.45"/>

            <!-- ফোন ডিরেক্টরি বুক শ্যাডো ও ব্যাক পার্ট -->
            <rect x="120" y="105" width="272" height="320" rx="26" fill="#001814" opacity="0.45"/>
            <rect x="120" y="96" width="272" height="320" rx="24" fill="#FFFFFF"/>
            <rect x="120" y="96" width="50" height="320" rx="24" fill="url(#gold)"/>
            <rect x="145" y="96" width="25" height="320" fill="url(#gold)"/>

            <!-- ডায়েরির স্পাইনের রিংস -->
            <circle cx="145" cy="146" r="6" fill="#004D40"/>
            <circle cx="145" cy="196" r="6" fill="#004D40"/>
            <circle cx="145" cy="246" r="6" fill="#004D40"/>
            <circle cx="145" cy="296" r="6" fill="#004D40"/>
            <circle cx="145" cy="346" r="6" fill="#004D40"/>

            <!-- সেন্ট্রাল ব্যাজ সার্কেল -->
            <circle cx="282" cy="216" r="64" fill="#004D40"/>
            <circle cx="282" cy="216" r="58" fill="none" stroke="url(#gold)" stroke-width="3"/>

            <!-- ফোন ডিরেক্টরি কল আইকন -->
            <path d="M 264 186 C 262 186 257 190 257 195 C 257 212 271 226 288 226 C 293 226 297 221 297 219 L 293 210 C 292 208 289 207 287 208 L 282 211 C 277 208 275 206 272 201 L 275 196 C 276 194 275 191 273 190 Z" fill="#FFFFFF"/>

            <!-- হাতপাখা প্রতীক -->
            <line x1="282" y1="250" x2="282" y2="268" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
            <path d="M 258 250 C 258 228 306 228 306 250 Z" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 265 250 C 265 237 299 237 299 250 Z" fill="none" stroke="url(#gold)" stroke-width="2"/>

            <!-- ডিরেক্টরি লাইনস -->
            <rect x="195" y="296" width="174" height="10" rx="5" fill="#E0E0E0"/>
            <rect x="215" y="316" width="134" height="8" rx="4" fill="#EEEEEE"/>

            <!-- IAB টেক্সট -->
            <text x="282" y="374" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="900" fill="#004D40" letter-spacing="3">IAB</text>
          </svg>
          EOF

          # ৩. সব মাপের অ্যান্ড্রয়েড স্ক্রিনের জন্য অ্যাপ আইকন তৈরি ও প্রতিস্থাপন
          rsvg-convert -w 48 -h 48 iab_logo.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          rsvg-convert -w 72 -h 72 iab_logo.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          rsvg-convert -w 96 -h 96 iab_logo.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          rsvg-convert -w 144 -h 144 iab_logo.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          rsvg-convert -w 192 -h 192 iab_logo.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # অ্যান্ড্রয়েডের ডিফল্ট ফ্ল্যাট আইকন এক্সএমএল সরানো যাতে সরাসরি নতুন লোগোটি দৃশ্যমান হয়
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          python3 -c '
          import os

          # ৪. minSdk ২৩ এবং compileSdk ৩৪ সেট করা
          app_bg = "android/app/build.gradle"
          if os.path.exists(app_bg):
              with open(app_bg, "r") as fl:
                  c = fl.read()
              c = c.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 34")
              c = c.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 34")
              c = c.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              c = c.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
              with open(app_bg, "w") as fl:
                  fl.write(c)

          # ৫. গুগল সার্ভিস প্লাগইন যুক্ত করা
          for sf in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(sf):
                  with open(sf, "r") as fl:
                      c = fl.read()
                  if "com.google.gms.google-services" not in c:
                      if sf.endswith(".kts"):
                          c = c.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false")
                      else:
                          c = c.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false")
                  with open(sf, "w") as fl:
                      fl.write(c)

          for bf in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(bf):
                  with open(bf, "r") as fl:
                      c = fl.read()
                  if "com.google.gms.google-services" not in c:
                      if bf.endswith(".kts"):
                          c = c.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\")")
                      else:
                          c += "\napply plugin: \"com.google.gms.google-services\"\n"
                  with open(bf, "w") as fl:
                      fl.write(c)

          # ৬. অ্যাপের নাম ও প্রয়োজনীয় পারমিশন যুক্ত করা
          mf = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf):
              with open(mf, "r") as fl:
                  c = fl.read()
              c = c.replace("android:label=\"phone\"", "android:label=\"IAB NC\"")
              queries = "\n    <queries>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <data android:scheme=\"tel\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <data android:scheme=\"sms\" />\n        </intent>\n        <package android:name=\"com.whatsapp\" />\n    </queries>\n"
              if "<queries>" not in c:
                  c = c.replace("</manifest>", queries + "</manifest>")
              with open(mf, "w") as fl:
                  fl.write(c)
          '

          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: IAB-Phone-App
          path: iab_phone/build/app/outputs/flutter-apk/app-release.apk
