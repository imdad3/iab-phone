name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Project and Build APK
        run: |
          flutter create --org com.iab --project-name phone iab_phone
          cd iab_phone
          flutter pub add firebase_core cloud_firestore url_launcher shared_preferences file_picker csv
          cp ../main.dart lib/main.dart
          cp ../google-services.json android/app/google-services.json

          python3 -c '
          import os

          # ১. file_picker সহ ক্যাশের সব প্লাগইন থেকে flutter.compileSdkVersion ইত্যাদি টেক্সট সম্পূর্ণ রিপ্লেস করা
          pub_cache = os.path.expanduser("~/.pub-cache")
          if os.path.exists(pub_cache):
              for root, dirs, files in os.walk(pub_cache):
                  for f in files:
                      if f.endswith((".gradle", ".gradle.kts")):
                          p = os.path.join(root, f)
                          try:
                              with open(p, "r", encoding="utf-8", errors="ignore") as fl:
                                  c = fl.read()
                              orig = c
                              c = c.replace("flutter.compileSdkVersion", "34")
                              c = c.replace("flutter.minSdkVersion", "23")
                              c = c.replace("flutter.targetSdkVersion", "34")
                              if c != orig:
                                  with open(p, "w", encoding="utf-8") as fl:
                                      fl.write(c)
                          except Exception:
                              pass

          # ২. মূল অ্যাপ ও প্রজেক্টের সব গ্র্যাডল ফাইল ফিক্স করা
          for root, dirs, files in os.walk("android"):
              for f in files:
                  if f.endswith((".gradle", ".gradle.kts")):
                      p = os.path.join(root, f)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as fl:
                              c = fl.read()
                          orig = c
                          c = c.replace("flutter.compileSdkVersion", "34")
                          c = c.replace("flutter.minSdkVersion", "23")
                          c = c.replace("flutter.targetSdkVersion", "34")
                          c = c.replace("minSdk = 21", "minSdk = 23")
                          c = c.replace("minSdkVersion 21", "minSdkVersion 23")
                          if c != orig:
                              with open(p, "w", encoding="utf-8") as fl:
                                  fl.write(c)
                      except Exception:
                          pass

          # ৩. android/app/build.gradle এ নিশ্চিতভাবে compileSdk ও minSdk দেওয়া
          app_bg = "android/app/build.gradle"
          if os.path.exists(app_bg):
              with open(app_bg, "r") as fl:
                  c = fl.read()
              c = c.replace("compileSdk = 34", "compileSdk = 34\n        compileSdkVersion = 34")
              with open(app_bg, "w") as fl:
                  fl.write(c)

          # ৪. গুগল সার্ভিস প্লাগইন যুক্ত করা
          for sf in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(sf):
                  with open(sf, "r") as fl:
                      c = fl.read()
                  if "com.google.gms.google-services" not in c:
                      if sf.endswith(".kts"):
                          c = c.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false")
                      else:
                          c = c.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false")
                  with open(sf, "w") as fl:
                      fl.write(c)

          for bf in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(bf):
                  with open(bf, "r") as fl:
                      c = fl.read()
                  if "com.google.gms.google-services" not in c:
                      if bf.endswith(".kts"):
                          c = c.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\")")
                      else:
                          c += "\napply plugin: \"com.google.gms.google-services\"\n"
                  with open(bf, "w") as fl:
                      fl.write(c)

          # ৫. অ্যাপের নাম ও প্রয়োজনীয় পারমিশন যুক্ত করা
          mf = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf):
              with open(mf, "r") as fl:
                  c = fl.read()
              c = c.replace("android:label=\"phone\"", "android:label=\"IAB NC\"")
              queries = "\n    <queries>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <data android:scheme=\"tel\" />\n        </intent>\n        <intent>\n            <action android:name=\"android.intent.action.VIEW\" />\n            <data android:scheme=\"sms\" />\n        </intent>\n        <package android:name=\"com.whatsapp\" />\n    </queries>\n"
              if "<queries>" not in c:
                  c = c.replace("</manifest>", queries + "</manifest>")
              with open(mf, "w") as fl:
                  fl.write(c)
          '

          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: IAB-Phone-App
          path: iab_phone/build/app/outputs/flutter-apk/app-release.apk
