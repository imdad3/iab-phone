name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Project and Build APK
        run: |
          flutter create --org com.iab --project-name phone iab_phone
          cd iab_phone
          flutter pub add firebase_core cloud_firestore url_launcher
          cp ../main.dart lib/main.dart
          cp ../google-services.json android/app/google-services.json

          python3 -c '
          import os

          # ১. সব গ্র্যাডল ফাইলে minSdk জোরপূর্বক ২৩ করা
          for root, dirs, files in os.walk("android"):
              for f in files:
                  if f in ["build.gradle", "build.gradle.kts"]:
                      p = os.path.join(root, f)
                      with open(p, "r") as fl:
                          c = fl.read()
                      c = c.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
                      c = c.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
                      c = c.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 23")
                      c = c.replace("minSdk = 21", "minSdk = 23")
                      c = c.replace("minSdkVersion 21", "minSdkVersion 23")
                      with open(p, "w") as fl:
                          fl.write(c)

          # ২. গুগল সার্ভিস প্লাগইন যুক্ত করা
          for sf in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(sf):
                  with open(sf, "r") as fl:
                      c = fl.read()
                  if "com.google.gms.google-services" not in c:
                      if sf.endswith(".kts"):
                          c = c.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false")
                      else:
                          c = c.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false")
                  with open(sf, "w") as fl:
                      fl.write(c)

          for bf in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(bf):
                  with open(bf, "r") as fl:
                      c = fl.read()
                  if "com.google.gms.google-services" not in c:
                      if bf.endswith(".kts"):
                          c = c.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\")")
                      else:
                          c += "\napply plugin: \"com.google.gms.google-services\"\n"
                  with open(bf, "w") as fl:
                      fl.write(c)

          # ৩. কল, মেসেজ ও হোয়াটসঅ্যাপ পারমিশন কোয়েরি
          mf = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf):
              with open(mf, "r") as fl:
                  c = fl.read()
              q = """
                  <queries>
                      <intent>
                          <action android:name="android.intent.action.VIEW" />
                          <data android:scheme="tel" />
                      </intent>
                      <intent>
                          <action android:name="android.intent.action.VIEW" />
                          <data android:scheme="sms" />
                      </intent>
                      <package android:name="com.whatsapp" />
                  </queries>
              """
              if "<queries>" not in c:
                  c = c.replace("</manifest>", q + "\n</manifest>")
              with open(mf, "w") as fl:
                  fl.write(c)
          '

          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: IAB-Phone-App
          path: iab_phone/build/app/outputs/flutter-apk/app-release.apk
